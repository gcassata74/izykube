spring:
  config:
    # Allow local runs to pick credentials from repo-level .env without manual export.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  data:
    mongodb:
      uri: mongodb://localhost:27017/izykube

server:
  port: 8090
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs.path: /api-docs

mongock:
  migration-scan-package:
    - com.izylife.izykube.changelogs
  # Keep deprecated key too for compatibility in mixed environments.
  change-logs-scan-package:
    - com.izylife.izykube.changelogs

app:
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
      - http://0.0.0.0:*
      - http://[::1]:*
      - ionic://localhost
      - capacitor://localhost
  assets:
    default-images:
      - nginx:latest
      - nginx:1.27
      - alpine:3.18
      - busybox:1.36
      - redis:7
      - postgres:16
      - mysql:8
      - mongo:7
      - node:22
      - openjdk:21
      - python:3.12
      - golang:1.22
      - debian:12
      - ubuntu:22.04
      - traefik:3.0
      - haproxy:2.8
      - memcached:1.6
      - rabbitmq:3.12

ai:
  local:
    base-url: http://localhost:11434
    model: llama3
    connect-timeout-ms: 5000
    read-timeout-ms: 120000

operatorhub:
  base-url: https://operatorhub.io
  api:
    url: https://operatorhub.io/api/operators
  install:
    base-url: https://operatorhub.io/install
  github:
    api-base-url: https://api.github.com
    repo: k8s-operatorhub/community-operators
    path: operators
    token: ""

gitops:
  enabled: true
  # Default local GitOps repository for backend running on host machine.
  # When backend runs in docker-compose, this is overridden to http://gitea:3000/...
  repo-url: http://localhost:3001/izykube/izykube-gitops.git
  # Optional repo URL used only by Argo CD Application source (defaults to repo-url).
  argo-cd-repo-url: ${GITOPS_ARGOCD_REPO_URL:}
  branch: main
  base-path: apps
  username: ${GITOPS_USERNAME:${GITEA_USER:}}
  password: ${GITOPS_PASSWORD:${GITEA_PASSWORD:}}
  commit-author-name: IzyKube
  commit-author-email: noreply@izylife.local
  argo-cd-namespace: argocd
  argo-cd-project: default
  auto-sync: true
  prune: true
  self-heal: true

