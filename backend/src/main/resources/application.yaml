spring:
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  data:
    mongodb:
      uri: mongodb://localhost:27017/izykube

server:
  port: 8090
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs.path: /api-docs

mongock:
  migration-scan-package: com.izylife.izykube.changelogs

app:
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
      - http://0.0.0.0:*
      - http://[::1]:*
      - ionic://localhost
      - capacitor://localhost
  assets:
    default-images:
      - nginx:latest
      - nginx:1.27
      - alpine:3.18
      - busybox:1.36
      - redis:7
      - postgres:16
      - mysql:8
      - mongo:7
      - node:22
      - openjdk:21
      - python:3.12
      - golang:1.22
      - debian:12
      - ubuntu:22.04
      - traefik:3.0
      - haproxy:2.8
      - memcached:1.6
      - rabbitmq:3.12

ai:
  local:
    base-url: http://localhost:11434
    model: mistral
    connect-timeout-ms: 5000
    read-timeout-ms: 120000

