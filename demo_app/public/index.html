<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySQL Connection Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #2b2d42;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 320px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    button {
      background: #4c6ef5;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background: #364fc7;
    }
    .result {
      margin-top: 1.25rem;
      font-weight: bold;
    }
    .result.success {
      color: #2f9e44;
    }
    .result.error {
      color: #e03131;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>MySQL Connection Test</h1>
    <button id="testButton">Test connection</button>
    <div id="result" class="result"></div>
  </div>

  <script>
    const button = document.getElementById('testButton');
    const resultElement = document.getElementById('result');

    button.addEventListener('click', async () => {
      resultElement.textContent = '';
      resultElement.className = 'result';
      button.disabled = true;
      button.textContent = 'Testing...';
      try {
        const response = await fetch('/test-connection');
        const data = await response.json();
        if (data.status === 'ok') {
          resultElement.textContent = 'Connection to MySQL succeeded (via service).';
          resultElement.classList.add('success');
        } else {
          resultElement.textContent = `Connection failed: ${data.message || 'Unknown error'}`;
          resultElement.classList.add('error');
        }
      } catch (error) {
        resultElement.textContent = `Connection failed: ${error.message}`;
        resultElement.classList.add('error');
      } finally {
        button.disabled = false;
        button.textContent = 'Test connection';
      }
    });
  </script>
</body>
</html>
