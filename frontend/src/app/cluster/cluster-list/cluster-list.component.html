<div class="content">
  <p-confirmDialog></p-confirmDialog>
  <p-card class="izy-card" header="Namespaces" i18n-header="@@namespaces">
    <div class="card-content">
      <div class="izy-button-container">
        <button
          pButton
          label="Add"
          icon="pi pi-plus"
          i18n-label="@@clusterList.addNamespace"
          class="p-button-outlined izy-primary-button"
          (click)="addCluster()"
        ></button>
      </div>
      <ng-container *ngIf="clusters$ | async as clusters">
        <p-table class="izy-table" [value]="clusters" [columns]="cols" styleClass="p-datatable-striped p-datatable-rounded">
          <ng-template pTemplate="header" let-columns>
            <tr>
              <th *ngFor="let col of columns">
                {{col.header}}
              </th>
              <th i18n>Actions</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-rowData let-columns="columns" let-even="even">
            <tr [ngClass]="{'izy-row-even': even, 'izy-row-odd': !even}" [pContextMenuRow]="items"
                (click)="onContextMenu($event, rowData.id)" [pEditableRow]="items">
              <td *ngFor="let col of columns" [ngClass]="{'status-column': col.field === 'status'}">
                <ng-container [ngSwitch]="col.field">
                  <ng-container *ngSwitchCase="'status'">
                    <div class="status-wrapper" [ngClass]="statusClass(rowData.id)">
                      <ng-container *ngIf="operationStatus(rowData.id) as opStatus; else staticStatus">
                        <i [class]="iconForStatus(opStatus)" aria-hidden="true"></i>
                        <span class="status-text">{{ operationLabel(rowData.id) }}</span>
                      </ng-container>
                      <ng-template #staticStatus>
                        <span class="status-text">{{ rowData.status }}</span>
                      </ng-template>
                    </div>
                  </ng-container>
                  <ng-container *ngSwitchCase="'grafana'">
                    <button
                      pButton
                      type="button"
                      class="p-button-text p-button-sm"
                      icon="pi pi-chart-line"
                      [disabled]="!hasMeshedResources(rowData)"
                      [pTooltip]="grafanaTooltipFor(rowData)"
                      tooltipPosition="top"
                      (click)="openGrafana(rowData)"
                    ></button>
                  </ng-container>
                  <ng-container *ngSwitchDefault>
                    <ng-container *ngIf="col.field === 'nameSpace'; else defaultCell">
                      <button
                        pButton
                        type="button"
                        class="p-button-link namespace-link"
                        (click)="openNamespaceVersions(rowData[col.field]); $event.stopPropagation()">
                        {{ rowData[col.field] }}
                      </button>
                    </ng-container>
                    <ng-template #defaultCell>
                      {{ rowData[col.field] }}
                    </ng-template>
                  </ng-container>
                </ng-container>
              </td>
              <td class="action-column">
                <div class="action-buttons">
                  <button pButton (click)="editDiagram(rowData.id)" aria-label="Edit diagram" i18n-aria-label="@@clusterList.action.editDiagram">
                    <i class="pi pi-pencil"></i>
                  </button>
                  <button pButton class="context-menu-trigger" #rowContextMenu
                          aria-label="Open actions"
                          i18n-aria-label="@@clusterList.action.openActions"
                          (click)="updateContextMenuItems($event,rowData.id)">
                    <i class="pi pi-ellipsis-v"></i>
                  </button>
                  <p-contextMenu #cm [model]="items" [target]="rowContextMenu" appendTo="body"></p-contextMenu>
                </div>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </ng-container>
    </div>
  </p-card>
</div>
