<form [formGroup]="form" class="cluster-form">
  <div class="form-group">
    <label for="saName">Name</label>
    <input id="saName" type="text" pInputText formControlName="name" placeholder="example-sa" />
  </div>

  <div class="form-group">
    <label>Namespace</label>
    <div class="p-text-secondary">Namespace: {{ clusterNamespace || 'default' }}</div>
  </div>

  <div class="form-group">
    <label for="saAutomount">Automount token</label>
    <p-inputSwitch id="saAutomount" formControlName="automountServiceAccountToken"></p-inputSwitch>
  </div>

  <div class="form-group">
    <label for="saRbacProfile">Kubernetes API Access (RBAC)</label>
    <p-dropdown
      id="saRbacProfile"
      formControlName="rbacProfile"
      [options]="[
        { label: 'None', value: 'NONE' },
        { label: 'View (read-only)', value: 'VIEW' },
        { label: 'Edit (read/write)', value: 'EDIT' },
        { label: 'Admin', value: 'ADMIN' }
      ]"
      optionLabel="label"
      optionValue="value"
      placeholder="None">
    </p-dropdown>
  </div>

  <div class="kv-editor">
    <div class="kv-editor__header">
      <h4>Annotations</h4>
      <button pButton type="button" label="Add" icon="pi pi-plus" class="p-button-sm p-button-text" (click)="addAnnotation()"></button>
    </div>

    <div class="kv-editor__hint" *ngIf="!annotationsArray.length">
      No annotations defined.
    </div>

    <div class="kv-editor__rows" formArrayName="annotations">
      <div class="kv-editor__row" *ngFor="let group of annotationsArray.controls; let i = index; trackBy: trackByIndex" [formGroupName]="i">
        <input type="text" pInputText formControlName="key" placeholder="key" />
        <input type="text" pInputText formControlName="value" placeholder="value" />
        <button pButton type="button" icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger" (click)="removeAnnotation(i)"></button>
      </div>
    </div>
  </div>
</form>
