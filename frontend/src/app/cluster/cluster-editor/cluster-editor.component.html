<div class="page-container">
  <div class="diagram">
    <app-diagram #diagram></app-diagram>
  </div>
  <div class="config-panel">
    <ng-container *ngIf="selectedLink$ | async as selectedLink; else nodePanel">
      <app-link-properties-form [link]="selectedLink"></app-link-properties-form>
    </ng-container>
    <ng-template #nodePanel>
      <app-node-form></app-node-form>
    </ng-template>
  </div>
</div>
