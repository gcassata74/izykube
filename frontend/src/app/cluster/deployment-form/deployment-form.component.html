<form [formGroup]="form" class="deployment-form">
  <div class="p-field">
    <span class="p-float-label">
      <input
        id="name"
        type="text"
        pInputText
        formControlName="name">
      <label for="name" i18n="@@deploymentName">Deployment Name</label>
    </span>
  </div>

  <div class="p-field">
    <span class="p-float-label">
      <p-inputNumber
        id="replicas"
        formControlName="replicas"
        [min]="0"
        [step]="1">
      </p-inputNumber>
      <label for="replicas" i18n="@@replicasCount">Replicas</label>
    </span>
  </div>

  <div class="p-field">
    <span class="p-float-label">
      <p-dropdown
        id="workloadType"
        [options]="workloadOptions"
        formControlName="workloadType"
        optionLabel="label"
        optionValue="value">
      </p-dropdown>
      <label for="workloadType" i18n="@@deploymentWorkloadType">Workload Type</label>
    </span>
  </div>

  <div class="p-field">
    <span class="p-float-label">
      <p-dropdown
        id="strategyType"
        [options]="strategyTypes"
        formControlName="strategyType"
        optionLabel="label"
        optionValue="value">
      </p-dropdown>
      <label for="strategyType" i18n="@@deploymentStrategy">Deployment Strategy</label>
    </span>
  </div>

  <div class="p-field">
    <span class="p-float-label">
      <p-dropdown
        id="assetId"
        [options]="(assets$ | async) ?? []"
        formControlName="assetId"
        optionLabel="name"
        optionValue="id"
        [showClear]="true">
        <ng-template let-asset pTemplate="item">
          <div>{{ asset.name }} - {{ asset.version }}</div>
        </ng-template>
      </p-dropdown>
      <label for="assetId" i18n="@@deploymentAsset">Container Asset</label>
    </span>
  </div>

  <div class="p-field">
    <span class="p-float-label">
      <p-inputNumber
        id="containerPort"
        formControlName="containerPort"
        [useGrouping]="false"
        buttonLayout="horizontal"
        spinnerMode="horizontal"
        decrementButtonClass="p-button-secondary"
        incrementButtonClass="p-button-secondary"
        incrementButtonIcon="pi pi-plus"
        decrementButtonIcon="pi pi-minus">
      </p-inputNumber>
      <label for="containerPort" i18n="@@deploymentPort">Container Port</label>
    </span>
  </div>

  <div class="p-field">
    <span class="p-float-label">
      <textarea
        id="command"
        pInputTextarea
        formControlName="command"
        [autoResize]="true"
        rows="2"></textarea>
      <label for="command" i18n="@@deploymentCommand">Command (one per line)</label>
    </span>
  </div>

  <div class="p-field">
    <span class="p-float-label">
      <textarea
        id="args"
        pInputTextarea
        formControlName="args"
        [autoResize]="true"
        rows="3"></textarea>
      <label for="args" i18n="@@deploymentArgs">Args (one per line)</label>
    </span>
  </div>

  <div class="p-field-checkbox">
    <div class="flex items-center" style="margin-bottom: 12px;">
      <p-checkbox id="addToMesh"
                  formControlName="addToMesh"
                  [binary]="true">
      </p-checkbox>
      <label for="addToMesh"
             class="ml-2"
             i18n="@@deploymentAddToMesh.label">
        Add to mesh
      </label>
    </div>
  </div>
</form>
