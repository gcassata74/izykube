<form [formGroup]="form" class="mb-3 mt-3 config-map-form">
  <div class="button-row">
    <p-splitButton
      label="Import"
      icon="pi pi-upload"
      class="action-split import-button"
      [model]="importMenuItems"
      buttonStyleClass="p-button-outlined"
      menuButtonStyleClass="p-button-outlined"
      (onClick)="triggerYamlImport()">
    </p-splitButton>
    <p-splitButton
      label="Export"
      icon="pi pi-download"
      class="action-split export-button"
      [model]="exportMenuItems"
      buttonStyleClass="p-button"
      menuButtonStyleClass="p-button"
      (onClick)="exportYaml()">
    </p-splitButton>
    <button
      pButton
      type="button"
      label="AI Assist"
      class="ai-button p-button-outlined"
      icon="pi pi-sparkles"
      (click)="openAiDialog()">
    </button>
  </div>

  <input
    #yamlInput
    type="file"
    accept=".yaml,.yml,text/yaml"
    hidden
    (change)="onFileSelected($event, 'yaml')" />
  <input
    #jsonInput
    type="file"
    accept=".json,application/json"
    hidden
    (change)="onFileSelected($event, 'json')" />

  <div appYaml formControlName="yaml" [width]="'250px'"></div>
  <div *ngIf="form.get('yaml')?.invalid && form.get('yaml')?.touched" class="text-danger">
    <div *ngIf="form.get('yaml')?.errors?.['required']">YAML is required</div>
    <div *ngIf="form.get('yaml')?.errors?.['yamlError']">
      {{ form.get('yaml')?.errors?.['yamlError']?.message }}
      <div *ngIf="form.get('yaml')?.errors?.['yamlError']?.line">
        Line: {{ form.get('yaml')?.errors?.['yamlError']?.line + 1 }},
        Column: {{ form.get('yaml')?.errors?.['yamlError']?.column + 1 }}
      </div>
    </div>
  </div>

  <p-dialog
    header="Generate with Local AI"
    [(visible)]="aiDialogVisible"
    [modal]="true"
    [dismissableMask]="!aiLoading"
    [closable]="!aiLoading"
    [style]="{ width: '460px' }"
    (onHide)="closeAiDialog()">
    <div class="ai-dialog">
      <p class="ai-dialog__hint">
        Describe the ConfigMap you need. The local model will return updated YAML.
      </p>
      <textarea
        pInputTextarea
        [(ngModel)]="aiPrompt"
        [ngModelOptions]="{ standalone: true }"
        [autoResize]="true"
        rows="5"
        placeholder="Example: Create a ConfigMap with database host, port, and credentials.">
      </textarea>
    </div>

    <ng-template pTemplate="footer">
      <button
        pButton
        type="button"
        label="Cancel"
        class="p-button-text"
        [disabled]="aiLoading"
        (click)="closeAiDialog()">
      </button>
      <button
        pButton
        type="button"
        label="Generate"
        icon="pi pi-sparkles"
        [disabled]="aiLoading"
        (click)="submitAiPrompt()">
      </button>
      <p-progressSpinner
        *ngIf="aiLoading"
        styleClass="ai-dialog__spinner"
        strokeWidth="4"
        [style]="{ width: '30px', height: '30px', marginLeft: '0.5rem' }">
      </p-progressSpinner>
    </ng-template>
  </p-dialog>
</form>
