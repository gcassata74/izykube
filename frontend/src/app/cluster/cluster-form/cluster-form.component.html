<div class="container custom-container mt-5">
  <div class="card">
    <div class="card-header">
      <h2 i18n="@@clusterForm.title">Create Diagram</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="clusterForm" (ngSubmit)="saveCluster()">
        <div class="mt-4 ml-4 mr-4">
          <span class="p-float-label">
            <input type="text"
                   id="clustername"
                   class="form-control"
                   pInputText
                   formControlName="name"
                   required
                   i18n-placeholder="@@clusterForm.name.placeholder"
                   placeholder="Enter diagram name"
                   (keyup)="clusterForm.get('name')?.markAsTouched()"/>
            <label for="clustername" i18n="@@clusterForm.name.label">Diagram Name</label>
          </span>
          <small class="text-danger"
                 *ngIf="clusterForm.get('name')?.touched && clusterForm.get('name')?.hasError('required')"
                 i18n="@@clusterForm.name.required">
            Field is mandatory, please fill it.
          </small>
          <small class="text-muted d-block mt-2" i18n="@@clusterForm.namespace.help">
            The namespace is generated from the diagram name and created automatically at deploy time.
          </small>
        </div>
        <div class="text-end">
          <button type="submit"
                  class="btn btn-primary me-2"
                  [disabled]="!clusterForm.valid"
                  i18n="@@clusterForm.button.save">Save
          </button>
          <button type="button"
                  class="btn btn-secondary"
                  (click)="cancel()"
                  i18n="@@clusterForm.button.cancel">Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
