<form [formGroup]="form">
  <div class="p-field">
    <span class="p-float-label">
      <input id="name" type="text" pInputText formControlName="name" class="w-full">
      <label for="name" i18n="@@serviceForm.name.label">Name</label>
    </span>
  </div>

  <div class="p-field" *ngIf="connectedDeploymentNames.length; else connectHint">
    <label i18n="@@serviceForm.connectedDeployments.label">Connected deployments</label>
    <ul class="service-form__connections">
      <li *ngFor="let deploymentName of connectedDeploymentNames">{{ deploymentName }}</li>
    </ul>
  </div>

  <ng-template #connectHint>
    <p class="service-form__hint" i18n="@@serviceForm.connectHint">
      Link this service to a deployment to auto-fill name and port.
    </p>
  </ng-template>

  <div class="p-field">
    <span class="p-float-label">
      <p-dropdown id="type"
                  [options]="serviceTypes"
                  formControlName="type"
                  optionLabel="name"
                  optionValue="value"
                  class="w-full">
      </p-dropdown>
      <label for="type" i18n="@@serviceForm.type.label">Type</label>
    </span>
  </div>

  <div class="p-field">
    <span class="p-float-label">
      <p-inputNumber id="port"
                     formControlName="port"
                     [min]="1"
                     [max]="65535"
                     [useGrouping]="false"
                     class="w-full">
      </p-inputNumber>
      <label for="port" i18n="@@serviceForm.port.label">Port</label>
    </span>
  </div>

  <div class="p-field" *ngIf="form.get('type')?.value === 'NodePort'">
    <span class="p-float-label">
      <p-inputNumber id="nodePort"
                     formControlName="nodePort"
                     [min]="30000"
                     [max]="32767"
                     [useGrouping]="false"
                     class="w-full">
      </p-inputNumber>
      <label for="nodePort" i18n="@@serviceForm.nodePort.label">Node Port</label>
    </span>
  </div>

  <div class="p-field-checkbox">
    <div class="flex items-center" style="margin-bottom: 12px;">
      <p-checkbox id="forwardEnabled"
                  formControlName="forwardEnabled"
                  [binary]="true">
      </p-checkbox>
      <label for="forwardEnabled"
             class="ml-2"
             i18n="@@serviceForm.forwardEnabled.label">
        Enable port forward
      </label>
    </div>
  </div>

  <div *ngIf="form.get('forwardEnabled')?.value" class="service-form__forward">
    <div class="p-field">
      <span class="p-float-label">
        <p-inputNumber id="forwardPort"
                       formControlName="forwardPort"
                       [min]="1"
                       [max]="65535"
                       [useGrouping]="false"
                       class="w-full">
        </p-inputNumber>
        <label for="forwardPort" i18n="@@serviceForm.forwardPort.label">Local port</label>
      </span>
    </div>

    <div class="p-field">
      <span class="p-float-label">
        <p-inputNumber id="forwardTargetPort"
                       formControlName="forwardTargetPort"
                       [min]="1"
                       [max]="65535"
                       [useGrouping]="false"
                       class="w-full">
        </p-inputNumber>
        <label for="forwardTargetPort" i18n="@@serviceForm.forwardTargetPort.label">Target port</label>
      </span>
    </div>

    <div class="service-form__forward-actions">
      <button
        pButton
        type="button"
        class="p-button-sm p-button-rounded p-button-warning"
        icon="pi pi-bolt"
        label="Activate"
        i18n-label="@@common.activate"
        [disabled]="forwardBusy || form.get('forwardActive')?.value || form.get('forwardPort')?.invalid || form.get('forwardTargetPort')?.invalid"
        (click)="activateForward()">
      </button>
    </div>

    <div *ngIf="form.get('forwardActive')?.value" class="service-form__forward-active">
      <span>
        <ng-container i18n="@@serviceForm.forwardActiveMessage">Forward active: localhost:{{ form.get('forwardPort')?.value }} → {{ form.get('forwardTargetPort')?.value }}</ng-container>
      </span>
      <button
        pButton
        type="button"
        class="p-button-text p-button-sm"
        icon="pi pi-times"
        pTooltip="Deactivate"
        i18n-pTooltip="@@serviceForm.deactivateForward"
        [disabled]="forwardBusy"
        (click)="deactivateForward()">
      </button>
    </div>
  </div>

</form>
