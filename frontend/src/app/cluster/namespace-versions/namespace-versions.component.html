<div class="content">
  <p-confirmDialog></p-confirmDialog>
  <p-card class="izy-card" [header]="namespace">
    <div class="card-content">
      <p-table class="izy-table" [value]="versions" [columns]="cols" [loading]="loading">
        <ng-template pTemplate="header" let-columns>
          <tr>
            <th *ngFor="let col of columns">{{ col.header }}</th>
            <th i18n="@@common.actions">Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row let-columns="columns">
          <tr>
            <td *ngFor="let col of columns">
              <ng-container [ngSwitch]="col.field">
                <span *ngSwitchCase="'createdAt'">{{ formatDate(row.createdAt) }}</span>
                <span *ngSwitchDefault>{{ row[col.field] }}</span>
              </ng-container>
            </td>
            <td class="action-column">
              <button
                pButton
                type="button"
                class="p-button-text p-button-sm"
                icon="pi pi-sitemap"
                label="Open in diagram"
                i18n-label="@@namespaceVersions.action.openDiagram"
                (click)="openVersion(row)">
              </button>
              <button
                pButton
                type="button"
                class="p-button-text p-button-sm p-button-danger"
                icon="pi pi-trash"
                label="Delete"
                i18n-label="@@common.delete"
                (click)="confirmDeleteVersion(row)">
              </button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td [attr.colspan]="cols.length + 1">
              <div class="izy-table-empty-message" i18n="@@namespaceVersions.empty">No versions found.</div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </p-card>
</div>
