<div class="app-shell" [class.app-shell--sidebar-collapsed]="sidebarCollapsed">
  <app-header
    [buttons]="buttons$ | async"
    [context]="clusterContext$ | async"
    (buttonAction)="performAction($event)"
    (menuTrigger)="openActions($event.event, $event.items)">
  </app-header>

  <div class="app-shell__body">
    <app-sidebar
      [collapsed]="sidebarCollapsed"
      [activeRoute]="currentRoute"
      (navigate)="navigate($event)"
      (collapseChange)="handleSidebarCollapseChange($event)">
    </app-sidebar>

    <main class="app-shell__content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <p-toast position="bottom-center"></p-toast>
  <p-menu #toolbarMenu [popup]="true"></p-menu>
</div>
