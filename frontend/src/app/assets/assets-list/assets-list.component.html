<div class="asset-list">
  <p-card class="izy-card">
    <ng-template pTemplate="header">
      <div class="card-header">
        <h2 i18n="@@assets.title">Assets</h2>
      </div>
    </ng-template>
    <div class="card-content">
      <div class="toolbar-container">
        <span class="p-input-icon-left search-input">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            i18n-placeholder="@@assets.searchPlaceholder"
            placeholder="Search assets..." />
        </span>
        <button pButton type="button" label="Add" i18n-label="@@common.add" icon="pi pi-plus" class="p-button-outlined izy-primary-button"
                (click)="addAsset()"></button>
      </div>
      <p-table
        #dt
        class="izy-table"
        [value]="(assets$ | async) || []"
        [globalFilterFields]="['name', 'type', 'version', 'port', 'image']"
        [paginator]="true"
        [rows]="10"
        styleClass="p-datatable-rounded">
        <ng-template pTemplate="header">
          <tr>
            <th *ngFor="let col of cols">{{col.header}}</th>
            <th i18n="@@common.actions">Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-asset>
          <tr>
            <td *ngFor="let col of cols">{{asset[col.field]}}</td>
            <td>
              <div class="action-buttons">
                <button pButton type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text"
                        aria-label="Edit"
                        i18n-aria-label="@@common.edit"
                        (click)="editAsset(asset.id)"></button>
                <button pButton type="button" icon="pi pi-ellipsis-v" class="p-button-rounded p-button-text"
                        aria-label="Open actions"
                        i18n-aria-label="@@common.openActions"
                        (click)="updateContextMenuItems($event, asset.id)" #rowContextMenu></button>
                <p-contextMenu #cm [model]="items" [target]="rowContextMenu" appendTo="body"></p-contextMenu>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </p-card>
</div>
