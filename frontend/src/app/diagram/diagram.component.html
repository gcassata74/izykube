<div class="container" #container>
  <div class="first-column" #paletteContainer>
    <div 
      *ngFor="let item of paletteItems" 
      class="palette-item"
      appDragDrop
      [isDraggable]="true"
      [dragData]="item">
      <img [src]="item.icon" [alt]="item.name" style="width: 40px; height: 40px;">
      <div class="palette-label">{{ item.name }}</div>
    </div>
  </div>

  <div 
    class="second-column" 
    #diagramCanvas
    appDragDrop
    [isDropZone]="true"
    (onDrop)="onCanvasDrop($event)"
    (click)="selectedNode = null; selectedLink = null; updateLinkStyles()">
    
    <!-- Diagram nodes rendered through Angular -->
    <div 
      *ngFor="let node of nodes" 
      class="diagram-node"
      appNodeConnector
      [nodeId]="node.id"
      (onConnectionStart)="onConnectionStart($event)"
      (onConnectionEnd)="onConnectionEnd($event)"
      (onConnectionCancel)="onConnectionCancel()"
      [style.position]="'absolute'"
      [style.left.px]="node.x"
      [style.top.px]="node.y"
      [style.width.px]="80"
      [style.height.px]="80"
      [style.border]="selectedNode?.id === node.id ? '3px solid #007bff' : '3px solid #ccc'"
      [style.border-radius.px]="10"
      [style.background-color]="'white'"
      [style.display]="'flex'"
      [style.flex-direction]="'column'"
      [style.align-items]="'center'"
      [style.justify-content]="'center'"
      [style.cursor]="'move'"
      [style.z-index]="2"
      (click)="selectNode(node); $event.stopPropagation()"
      (mousedown)="onNodeMouseDown($event, node)">
      
      <!-- Connection points -->
      <div 
        *ngFor="let point of getConnectionPoints(node)"
        class="connection-point"
        [class.connection-point-top]="point.side === 'top'"
        [class.connection-point-right]="point.side === 'right'"
        [class.connection-point-bottom]="point.side === 'bottom'"
        [class.connection-point-left]="point.side === 'left'"
        [class.connection-point-active]="isConnecting && connectionStartNode?.id === node.id && connectionStartPoint?.side === point.side"
        (mousedown)="onConnectionPointClick(node, point, $event)">
      </div>
      
      <img [src]="node.icon" [alt]="node.name" style="width: 40px; height: 40px;">
      <div 
        style="font-size: 10px; text-align: center; margin-top: 2px;"
        contenteditable="true"
        (blur)="onNodeLabelEdit(node, $event)">
        {{ node.name }}
      </div>
    </div>
  </div>
</div>
